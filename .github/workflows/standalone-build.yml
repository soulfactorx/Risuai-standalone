# 단독 HTML(risuai.html) 빌드 · GitHub Pages 배포 · 릴리스
#
# main 브랜치에 푸시(PR 머지)되면
#   1. 단일 HTML 파일을 빌드하고
#   2. GitHub Pages 에 배포하고 (https://<사용자>.github.io/<저장소>/)
#   3. 릴리스를 만들어 risuai.html 을 첨부한다.
# Actions 탭에서 수동 실행(workflow_dispatch)할 수도 있다.
#
# 약관 안내 화면을 끄려면 저장소 Settings → Secrets and variables → Actions → Variables 에
# VITE_RISU_LEGAL_CONFIGURED 변수를 직접 추가해야 한다. (자동으로 설정하지 않음)
#
# GitHub Pages 를 처음 사용할 때는 저장소 Settings → Pages → Build and deployment 의
# Source 를 "GitHub Actions" 로 지정해야 할 수 있다.
name: Standalone HTML Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "릴리스도 만들기"
        type: boolean
        default: true
  push:
    branches: [ "main" ]

# 같은 브랜치에서 동시에 여러 번 배포하지 않도록 한다.
concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 단독 HTML 빌드
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 단독 HTML 빌드
        env:
          VITE_RISU_LEGAL_CONFIGURED: ${{ vars.VITE_RISU_LEGAL_CONFIGURED }}
        run: pnpm build:standalone

      - name: 버전 확인
        id: version
        run: echo "version=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"

      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: risuai-standalone
          path: dist-standalone/risuai.html
          if-no-files-found: error

      # GitHub Pages 용 폴더: 단독 HTML 을 index.html 로 사용한다.
      - name: Pages 파일 준비
        run: |
          mkdir -p pages
          cp dist-standalone/risuai.html pages/index.html
          # 웹앱(PWA) 설치용 파일 (manifest, 서비스 워커, 아이콘)
          cp dist-standalone/manifest.webmanifest dist-standalone/pwa-sw.js dist-standalone/icon-192.png dist-standalone/icon-512.png pages/
          touch pages/.nojekyll

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  pages:
    name: GitHub Pages 배포
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 설정
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: 릴리스 만들기
    needs: build
    if: github.event_name == 'push' || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 빌드 결과 받기
        uses: actions/download-artifact@v4
        with:
          name: risuai-standalone

      - name: 릴리스 생성
        uses: softprops/action-gh-release@v2
        with:
          # 예: standalone-2026.10.292-15 (앱 버전 + 실행 번호)
          tag_name: standalone-${{ needs.build.outputs.version }}-${{ github.run_number }}
          name: 단독 HTML ${{ needs.build.outputs.version }} (빌드 ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: risuai.html
          body: |
            웹 서버 없이 브라우저로 바로 열어서 사용하는 단독 HTML 버전입니다.

            - 아래 `risuai.html` 을 내려받아 더블클릭해서 실행하세요.
            - 또는 GitHub Pages 주소에서 바로 사용할 수 있습니다: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            - 자세한 내용은 저장소의 STANDALONE.md 를 참고하세요.

            커밋: ${{ github.sha }}
