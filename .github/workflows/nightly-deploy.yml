name: Nightly Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: nightly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # 이 포크에서는 원본 저장소 전용 배포(Cloudflare/도커 이미지)를 실행하지 않는다.
    if: github.repository == 'kwaroran/Risuai'
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: set build time
        run: echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build
        env:
          VITE_RISU_LEGAL_CONFIGURED: 'TRUE'
          VITE_RISU_NIGHTLY_BUILD: 'TRUE'
          VITE_RISU_BUILD_TIME: ${{ env.BUILD_TIME }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ secrets.CLOUDFLARE_NIGHTLY_PROJECT_NAME }}
